<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sowing Season</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Watercolor icon defs: namespaced nav-* filters (garden-scene.js emits its own
       #wc1–#wc3/#paper inside each scene SVG — same params today, but never share ids)
       plus the eight ni-* sidebar glyphs. Present once, before #main, so any view can
       <use> them later. Pigments are CSS variables with Option-A fallbacks — under
       Option A they always resolve to the fallbacks; the vars stay for future retints. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="nav-wc1" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="4" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="nav-wc2" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="23" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="nav-wc3" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="3" seed="41" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="nav-paper">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
        <feColorMatrix in="n" type="matrix"
          values="0 0 0 0 0.42  0 0 0 0 0.40  0 0 0 0 0.33  0 0 0 0.045 0"/>
        <feComposite operator="over" in2="SourceGraphic"/>
      </filter>

      <!-- brand seedling -->
      <g id="ni-seed">
        <ellipse class="nw2" cx="60" cy="101" rx="27" ry="8"  fill="var(--bk,#c9ad7e)" opacity=".55"/>
        <ellipse class="nw1" cx="60" cy="102" rx="19" ry="5.6" fill="var(--bd,#a58a5e)" opacity=".6"/>
        <path class="nw2" d="M60,99 C60,86 59,74 60,60" stroke="var(--su,#d7e4c2)" stroke-width="10"
              fill="none" stroke-linecap="round" opacity=".45"/>
        <path class="nw1" d="M60,99 C60,86 59,74 60,60" stroke="var(--sm,#9dc08a)" stroke-width="4.6"
              fill="none" stroke-linecap="round" opacity=".9"/>
        <ellipse class="nw2" cx="43" cy="58" rx="17" ry="8.6" fill="var(--su,#cfe0b8)" opacity=".5"  transform="rotate(-30 43 58)"/>
        <ellipse class="nw1" cx="44" cy="58" rx="14.4" ry="7.2" fill="var(--sm,#9dc08a)" opacity=".9" transform="rotate(-30 44 58)"/>
        <ellipse class="nw3" cx="77" cy="55" rx="17" ry="8.6" fill="var(--su,#cfe0b8)" opacity=".5"  transform="rotate(28 77 55)"/>
        <ellipse class="nw2" cx="76" cy="55" rx="14.4" ry="7.2" fill="var(--sm,#9dc08a)" opacity=".9" transform="rotate(28 76 55)"/>
      </g>

      <!-- Garden — sunflower -->
      <g id="ni-sunflower">
        <g class="nw2" opacity=".5">
          <ellipse cx="60" cy="34" rx="9.4" ry="17" fill="var(--gu,#f2d9a0)"/>
          <ellipse cx="60" cy="34" rx="9.4" ry="17" fill="var(--gu,#f2d9a0)" transform="rotate(60 60 58)"/>
          <ellipse cx="60" cy="34" rx="9.4" ry="17" fill="var(--gu,#f2d9a0)" transform="rotate(120 60 58)"/>
          <ellipse cx="60" cy="34" rx="9.4" ry="17" fill="var(--gu,#f2d9a0)" transform="rotate(180 60 58)"/>
          <ellipse cx="60" cy="34" rx="9.4" ry="17" fill="var(--gu,#f2d9a0)" transform="rotate(240 60 58)"/>
          <ellipse cx="60" cy="34" rx="9.4" ry="17" fill="var(--gu,#f2d9a0)" transform="rotate(300 60 58)"/>
        </g>
        <g class="nw1" opacity=".9">
          <ellipse cx="60" cy="36" rx="7.6" ry="14.4" fill="var(--gm,#e9c46a)"/>
          <ellipse cx="60" cy="36" rx="7.6" ry="14.4" fill="var(--gm,#e9c46a)" transform="rotate(60 60 58)"/>
          <ellipse cx="60" cy="36" rx="7.6" ry="14.4" fill="var(--gm,#e9c46a)" transform="rotate(120 60 58)"/>
          <ellipse cx="60" cy="36" rx="7.6" ry="14.4" fill="var(--gm,#e9c46a)" transform="rotate(180 60 58)"/>
          <ellipse cx="60" cy="36" rx="7.6" ry="14.4" fill="var(--gm,#e9c46a)" transform="rotate(240 60 58)"/>
          <ellipse cx="60" cy="36" rx="7.6" ry="14.4" fill="var(--gm,#e9c46a)" transform="rotate(300 60 58)"/>
        </g>
        <circle class="nw3" cx="60" cy="58" r="15" fill="#d98a63" opacity=".8"/>
        <circle class="nw2" cx="60" cy="58" r="10.4" fill="#b8543a" opacity=".85"/>
      </g>

      <!-- Budget — clipboard -->
      <g id="ni-clipboard">
        <rect class="nw2" x="33" y="25" width="54" height="76" rx="9" fill="var(--cu,#f7f0da)" opacity=".5"/>
        <rect class="nw1" x="35" y="27" width="50" height="72" rx="8" fill="var(--cm,#efe6cc)" opacity=".9"/>
        <rect class="nw3" x="49" y="16" width="22" height="14" rx="5" fill="var(--bk,#b99a6b)" opacity=".95"/>
        <path class="nw1" d="M45,50 H75" stroke="#5a6a4c" stroke-width="7" stroke-linecap="round" opacity=".9"/>
        <path class="nw3" d="M45,64 H75" stroke="#5a6a4c" stroke-width="7" stroke-linecap="round" opacity=".9"/>
        <path class="nw2" d="M45,78 H63" stroke="#5a6a4c" stroke-width="7" stroke-linecap="round" opacity=".9"/>
        <circle class="nw1" cx="73" cy="78" r="6" fill="#4a7c46" opacity=".9"/>
      </g>

      <!-- Transactions — receipt -->
      <g id="ni-receipt">
        <path class="nw2" d="M38,20 H82 V94 L74.7,87 L67.3,94 L60,87 L52.7,94 L45.3,87 L38,94 Z"
              fill="var(--cu,#f7f0da)" opacity=".5"/>
        <path class="nw1" d="M40,22 H80 V91 L73.3,85 L66.7,91 L60,85 L53.3,91 L46.7,85 L40,91 Z"
              fill="var(--cm,#efe6cc)" opacity=".9"/>
        <path class="nw3" d="M48,38 H72" stroke="#5a6a4c" stroke-width="7" stroke-linecap="round" opacity=".9"/>
        <path class="nw1" d="M48,51 H72" stroke="#5a6a4c" stroke-width="7" stroke-linecap="round" opacity=".9"/>
        <path class="nw2" d="M48,64 H60" stroke="#5a6a4c" stroke-width="7" stroke-linecap="round" opacity=".9"/>
        <path class="nw3" d="M64,64 H72" stroke="#b8543a" stroke-width="7" stroke-linecap="round" opacity=".9"/>
      </g>

      <!-- Import CSV — arrow into tray -->
      <g id="ni-import">
        <path class="nw2" d="M60,20 V56" stroke="var(--gu,#f2d9a0)" stroke-width="15" stroke-linecap="round" opacity=".5"/>
        <path class="nw1" d="M60,22 V54" stroke="var(--gm,#e9c46a)" stroke-width="9" stroke-linecap="round" opacity=".9"/>
        <path class="nw2" d="M42,48 L60,72 L78,48 Z" fill="var(--gu,#f2d9a0)" opacity=".5"/>
        <path class="nw3" d="M44,49 L60,70 L76,49 Z" fill="var(--gm,#e9c46a)" opacity=".9"/>
        <path class="nw1" d="M32,74 V92 H88 V74" stroke="var(--tu,#dfe6d2)" stroke-width="10"
              fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
        <path class="nw3" d="M33,75 V91 H87 V75" stroke="var(--tm,#cfd8bf)" stroke-width="5.4"
              fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
      </g>

      <!-- Year Overview — trend line -->
      <g id="ni-chart">
        <path class="nw2" d="M26,94 L26,74 L46,62 L64,72 L94,40 L94,94 Z" fill="var(--sm,#9dc08a)" opacity=".3"/>
        <path class="nw2" d="M26,74 L46,62 L64,72 L94,40" stroke="var(--su,#d7e4c2)" stroke-width="10"
              fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
        <path class="nw1" d="M26,74 L46,62 L64,72 L94,40" stroke="var(--sm,#9dc08a)" stroke-width="5"
              fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
        <circle class="nw3" cx="94" cy="40" r="7.4" fill="var(--gu,#f2d9a0)" opacity=".6"/>
        <circle class="nw1" cx="94" cy="40" r="5.4" fill="var(--gm,#e9c46a)" opacity=".95"/>
      </g>

      <!-- AUM — tree -->
      <g id="ni-tree">
        <ellipse class="nw2" cx="60" cy="100" rx="24" ry="6.6" fill="var(--bk,#c9ad7e)" opacity=".5"/>
        <path class="nw2" d="M60,99 C60,88 59,80 60,68" stroke="var(--bu,#e0cba3)" stroke-width="10"
              fill="none" stroke-linecap="round" opacity=".45"/>
        <path class="nw1" d="M60,99 C60,88 59,80 60,68" stroke="var(--bk,#c9ad7e)" stroke-width="5.4"
              fill="none" stroke-linecap="round" opacity=".9"/>
        <circle class="nw2" cx="45" cy="55" r="19" fill="var(--su,#cfe0b8)" opacity=".5"/>
        <circle class="nw3" cx="75" cy="53" r="19" fill="var(--su,#cfe0b8)" opacity=".5"/>
        <circle class="nw1" cx="60" cy="40" r="20" fill="var(--su,#cfe0b8)" opacity=".5"/>
        <circle class="nw1" cx="46" cy="55" r="15.4" fill="var(--sm,#9dc08a)" opacity=".85"/>
        <circle class="nw2" cx="74" cy="53" r="15.4" fill="var(--sm,#9dc08a)" opacity=".85"/>
        <circle class="nw3" cx="60" cy="41" r="16.4" fill="var(--sm,#9dc08a)" opacity=".85"/>
        <circle class="nw2" cx="60" cy="50" r="9.4" fill="var(--sd,#6f9260)" opacity=".6"/>
      </g>

      <!-- Settings — gear -->
      <g id="ni-gear">
        <g class="nw2" opacity=".5">
          <rect x="54" y="16" width="12" height="18" rx="4" fill="var(--cu,#f2ecd8)"/>
          <rect x="54" y="16" width="12" height="18" rx="4" fill="var(--cu,#f2ecd8)" transform="rotate(60 60 60)"/>
          <rect x="54" y="16" width="12" height="18" rx="4" fill="var(--cu,#f2ecd8)" transform="rotate(120 60 60)"/>
          <rect x="54" y="16" width="12" height="18" rx="4" fill="var(--cu,#f2ecd8)" transform="rotate(180 60 60)"/>
          <rect x="54" y="16" width="12" height="18" rx="4" fill="var(--cu,#f2ecd8)" transform="rotate(240 60 60)"/>
          <rect x="54" y="16" width="12" height="18" rx="4" fill="var(--cu,#f2ecd8)" transform="rotate(300 60 60)"/>
        </g>
        <g class="nw1" opacity=".9">
          <rect x="55.4" y="18" width="9.2" height="15" rx="3.4" fill="var(--cm,#e8e2cd)"/>
          <rect x="55.4" y="18" width="9.2" height="15" rx="3.4" fill="var(--cm,#e8e2cd)" transform="rotate(60 60 60)"/>
          <rect x="55.4" y="18" width="9.2" height="15" rx="3.4" fill="var(--cm,#e8e2cd)" transform="rotate(120 60 60)"/>
          <rect x="55.4" y="18" width="9.2" height="15" rx="3.4" fill="var(--cm,#e8e2cd)" transform="rotate(180 60 60)"/>
          <rect x="55.4" y="18" width="9.2" height="15" rx="3.4" fill="var(--cm,#e8e2cd)" transform="rotate(240 60 60)"/>
          <rect x="55.4" y="18" width="9.2" height="15" rx="3.4" fill="var(--cm,#e8e2cd)" transform="rotate(300 60 60)"/>
        </g>
        <circle class="nw2" cx="60" cy="60" r="27" stroke="var(--cu,#f2ecd8)" stroke-width="17" fill="none" opacity=".5"/>
        <circle class="nw1" cx="60" cy="60" r="27" stroke="var(--cm,#e8e2cd)" stroke-width="12" fill="none" opacity=".9"/>
        <circle class="nw3" cx="60" cy="60" r="17.4" stroke="var(--sd,#8aa070)" stroke-width="5" fill="none" opacity=".6"/>
      </g>
    </defs>
  </svg>
  <div id="app">
    <aside id="sidebar">
      <div class="brand"><svg class="ni" viewBox="0 0 120 120" aria-hidden="true"><use href="#ni-seed"/></svg><span class="brand-label">Sowing Season</span></div>
      <div class="month-picker">
        <label>Month</label>
        <select id="monthSelect"></select>
        <button id="newMonthBtn" class="btn btn-accent btn-sm" title="Create the next month: carryovers roll forward automatically">+ Start next month</button>
      </div>
      <nav id="nav">
        <button data-view="garden" class="nav-btn active"><svg class="ni" viewBox="0 0 120 120" aria-hidden="true"><use href="#ni-sunflower"/></svg><span>Garden</span></button>
        <button data-view="budget" class="nav-btn"><svg class="ni" viewBox="0 0 120 120" aria-hidden="true"><use href="#ni-clipboard"/></svg><span>Budget</span></button>
        <button data-view="transactions" class="nav-btn"><svg class="ni" viewBox="0 0 120 120" aria-hidden="true"><use href="#ni-receipt"/></svg><span>Transactions</span></button>
        <button data-view="import" class="nav-btn"><svg class="ni" viewBox="0 0 120 120" aria-hidden="true"><use href="#ni-import"/></svg><span>Import CSV</span></button>
        <button data-view="reports" class="nav-btn"><svg class="ni" viewBox="0 0 120 120" aria-hidden="true"><use href="#ni-chart"/></svg><span>Year Overview</span></button>
        <button data-view="aum" class="nav-btn"><svg class="ni" viewBox="0 0 120 120" aria-hidden="true"><use href="#ni-tree"/></svg><span>AUM</span></button>
        <button data-view="settings" class="nav-btn"><svg class="ni" viewBox="0 0 120 120" aria-hidden="true"><use href="#ni-gear"/></svg><span>Settings</span></button>
      </nav>
      <div class="sidebar-foot">
        <div id="saveStatus" class="save-status">All changes saved</div>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
