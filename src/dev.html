<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sowing Season (dev)</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">🌱 Sowing Season</div>
      <div class="month-picker">
        <label>Month</label>
        <select id="monthSelect"></select>
        <button id="newMonthBtn" class="btn btn-accent btn-sm">+ Start next month</button>
      </div>
      <nav id="nav">
        <button data-view="garden" class="nav-btn active">🌻 Garden</button>
        <button data-view="budget" class="nav-btn">📋 Budget</button>
        <button data-view="transactions" class="nav-btn">🧾 Transactions</button>
        <button data-view="import" class="nav-btn">⬇️ Import CSV</button>
        <button data-view="reports" class="nav-btn">📈 Year Overview</button>
        <button data-view="aum" class="nav-btn">🌳 AUM</button>
        <button data-view="settings" class="nav-btn">⚙️ Settings</button>
      </nav>
      <div class="sidebar-foot">
        <div id="saveStatus" class="save-status">All changes saved</div>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="toast"></div>
  <script>
    // Browser-testing shim for the Electron preload API. No persistence.
    // ?blank=1 boots the empty state (onboarding wizard). ?csv=/path1,/path2
    // makes each "Choose file" serve the next listed path (fixtures work:
    // /tools/fixtures/10-capitalone-card-us.csv); default is /sample.csv.
    const devParams = new URLSearchParams(location.search);
    const devCsvQueue = (devParams.get('csv') || '/sample.csv').split(',');
    let devCsvIdx = 0;
    window.budgetAPI = {
      loadData: () => devParams.has('blank')
        ? Promise.resolve({
            version: 6,
            settings: { tithePercent: 0.10, appName: 'Sowing Season' },
            months: [],
            aum: { assets: [], debts: [], snapshots: [], log: [] },
          })
        : fetch('/data/seed.json').then((r) => r.json()),
      saveData: async (d) => { window.__devSaved = d; return true; },
      openCsv: async () => {
        const p = devCsvQueue[Math.min(devCsvIdx++, devCsvQueue.length - 1)];
        return { path: p, text: await fetch(p).then((r) => r.text()) };
      },
      loadBankProfiles: async () => window.__devProfiles || { version: 1, profiles: [] },
      saveBankProfiles: async (store) => { window.__devProfiles = store; return true; },
      revealData: async () => alert('(dev mode)'),
      exportData: async () => true,
      openExternal: async (url) => { console.log('openExternal:', url); return true; },
    };
  </script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
