<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Sowing Season app mark — the same watercolor technique as the garden
       (three displacement-filtered wash passes + paper grain), no raster art.
       tools/icon-export.html rasterises this to build/icon.ico at packaging time. -->
  <defs>
    <filter id="wc1" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wc2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="4" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wc3" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.40  0 0 0 0 0.33  0 0 0 0.06 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <style>.wc1{filter:url(#wc1)}.wc2{filter:url(#wc2)}.wc3{filter:url(#wc3)}</style>
  <!-- parchment tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#fdfcf7" filter="url(#paper)"/>
  <g clip-path="url(#tile)">
    <!-- a warm sun wash upper-left, sky wash, soil at the foot -->
    <circle class="wc2" cx="62" cy="58" r="54" fill="#f1cf6a" opacity=".35"/>
    <rect class="wc1" x="-10" y="120" width="280" height="60" fill="#d7e4dc" opacity=".35"/>
    <ellipse class="wc2" cx="128" cy="218" rx="104" ry="26" fill="#c9ad7e" opacity=".55"/>
    <ellipse class="wc1" cx="132" cy="221" rx="82" ry="19" fill="#a58a5e" opacity=".55"/>
    <ellipse class="wc3" cx="136" cy="225" rx="56" ry="12" fill="#7d6743" opacity=".4"/>
    <!-- the sprout: light washes -->
    <g class="wc2">
      <path d="M128,212 C128,176 124,150 128,106" stroke="#9dc08a" stroke-width="22" fill="none" stroke-linecap="round" opacity=".5"/>
      <ellipse cx="84" cy="150" rx="44" ry="20" fill="#9dc08a" opacity=".55" transform="rotate(-28 84 150)"/>
      <ellipse cx="172" cy="134" rx="44" ry="20" fill="#9dc08a" opacity=".55" transform="rotate(24 172 134)"/>
      <ellipse cx="128" cy="92" rx="22" ry="30" fill="#9dc08a" opacity=".55"/>
    </g>
    <!-- mid tones -->
    <g class="wc1">
      <path d="M128,212 C128,176 124,150 128,106" stroke="#4a7c46" stroke-width="11" fill="none" stroke-linecap="round" opacity=".85"/>
      <ellipse cx="86" cy="150" rx="38" ry="16" fill="#4a7c46" opacity=".7" transform="rotate(-28 86 150)"/>
      <ellipse cx="170" cy="134" rx="38" ry="16" fill="#4a7c46" opacity=".7" transform="rotate(24 170 134)"/>
      <ellipse cx="128" cy="94" rx="17" ry="24" fill="#4a7c46" opacity=".7"/>
    </g>
    <!-- dark accents: leaf veins, a shadow side on the crown -->
    <g class="wc3">
      <path d="M62,166 C80,156 100,150 118,146" stroke="#3d6a3a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
      <path d="M194,118 C176,118 156,124 138,130" stroke="#3d6a3a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
      <ellipse cx="134" cy="98" rx="9" ry="18" fill="#3d6a3a" opacity=".45"/>
    </g>
  </g>
</svg>
